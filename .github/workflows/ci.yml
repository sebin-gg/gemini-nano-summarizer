name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Check JS syntax
        run: |
          set -e
          files=$(find . -name '*.js' -not -path './node_modules/*')
          if [ -n "$files" ]; then
            for f in $files; do node --check "$f"; done
          fi
      - name: Check HTML
        run: |
          set -e
          for f in $(find . -name '*.html' -not -path './node_modules/*'); do
            python -c "import sys; from html.parser import HTMLParser; p=HTMLParser(); p.feed(open('$f', encoding='utf-8', errors='ignore').read())" || exit 1
          done