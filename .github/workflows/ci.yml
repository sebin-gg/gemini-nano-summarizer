name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JS syntax
        run: |
          set -e
          files=$(find . -name '*.js' -not -path './node_modules/*')
          if [ -n "$files" ]; then
            for f in $files; do node --check "$f"; done
          fi
      - name: Check HTML
        run: |
          set -e
          for f in $(find . -name '*.html' -not -path './node_modules/*'); do
            python -c "import sys; from html.parser import HTMLParser; p=HTMLParser(); p.feed(open('$f', encoding='utf-8', errors='ignore').read())" || exit 1
          done